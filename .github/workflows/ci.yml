name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Zero-dependency package: npm test runs syntax checks plus the
      # behavioral regression harness; no install step is needed.
      - run: npm test

  pack:
    # Publishes are manual, but the files whitelist is easy to break silently.
    # Fail early when the packed tarball no longer matches expectations.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm pack --dry-run
      - name: Assert packed contents
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const data = require("./pack.json");
            // npm >= 11 nests the report under the package name.
            const report = data.files !== undefined ? data : Object.values(data)[0];
            const names = report.files.map((f) => f.path).sort();
            const expected = [
              "LICENSE",
              "README.md",
              "README.zh.md",
              "cordis.patch.yml",
              "docs/assets/quote-followup-demo.gif",
              "docs/assets/quote-followup-demo.webm",
              "lib/client.js",
              "lib/index.d.ts",
              "lib/index.js",
              "package.json"
            ].sort();
            if (JSON.stringify(names) !== JSON.stringify(expected)) {
              console.error("unexpected packed contents:", names);
              process.exit(1);
            }
            console.log("packed contents OK:", names.length, "files");
          '
      - name: Clean up pack report
        if: always()
        run: rm -f pack.json
